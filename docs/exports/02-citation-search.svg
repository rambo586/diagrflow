<svg id="prisma-diagram-svg" role="img" aria-label="PRISMA 2020 flow diagram" width="1292" height="738" viewBox="0 0 1292 738" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow-down" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto"><path d="M0 0 L4 7 L8 0" fill="none" stroke="#111" stroke-width="1.2"/></marker><marker id="arrow-right" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#111" stroke-width="1.2"/></marker></defs><rect width="1292" height="738" fill="#ffffff"/><text x="376" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111">Identification of studies via databases and registers</text><text x="998" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111">Identification of studies via other methods</text><g><text x="22" y="117" text-anchor="middle" transform="rotate(-90 22 117)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111">Identification</text></g><g><text x="22" y="353" text-anchor="middle" transform="rotate(-90 22 353)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111">Screening</text></g><g><text x="22" y="565" text-anchor="middle" transform="rotate(-90 22 565)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111">Included</text></g><line x1="340" y1="84" x2="412" y2="84" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-right)"/><line x1="206" y1="178" x2="206" y2="214" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-down)"/><line x1="340" y1="242" x2="412" y2="242" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-right)"/><line x1="206" y1="272" x2="206" y2="308" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-down)"/><line x1="340" y1="336" x2="412" y2="336" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-right)"/><line x1="206" y1="366" x2="206" y2="402" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-down)"/><line x1="340" y1="430" x2="412" y2="430" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-right)"/><line x1="206" y1="460" x2="206" y2="528" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-down)"/><line x1="886" y1="146" x2="886" y2="308" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-down)"/><line x1="886" y1="366" x2="886" y2="402" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-down)"/><line x1="886" y1="460" x2="340" y2="565" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-down)"/><g><rect x="72" y="56" width="268" height="122" fill="#ffffff" stroke="#111" stroke-width="1.2"/><text x="82" y="74" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Records identified from*:</text><text x="82" y="92" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Databases (n = 920)</text><text x="82" y="107" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Registers (n = 12)</text><text x="82" y="122" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">  PubMed (n = 410)</text><text x="82" y="137" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">  Embase (n = 338)</text><text x="82" y="152" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">  Scopus (n = 172)</text></g><g><rect x="412" y="56" width="268" height="58" fill="#ffffff" stroke="#111" stroke-width="1.2"/><text x="422" y="74" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Records removed before screening:</text><text x="422" y="92" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Duplicate records removed (n = 210)</text></g><g><rect x="72" y="214" width="268" height="58" fill="#ffffff" stroke="#111" stroke-width="1.2"/><text x="82" y="232" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Records screened</text><text x="82" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 722)</text></g><g><rect x="412" y="214" width="268" height="58" fill="#ffffff" stroke="#111" stroke-width="1.2"/><text x="422" y="232" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Records excluded**</text><text x="422" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 580)</text></g><g><rect x="72" y="308" width="268" height="58" fill="#ffffff" stroke="#111" stroke-width="1.2"/><text x="82" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Reports sought for retrieval</text><text x="82" y="344" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 142)</text></g><g><rect x="412" y="308" width="268" height="58" fill="#ffffff" stroke="#111" stroke-width="1.2"/><text x="422" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Reports not retrieved</text><text x="422" y="344" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 6)</text></g><g><rect x="72" y="402" width="268" height="58" fill="#ffffff" stroke="#111" stroke-width="1.2"/><text x="82" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Reports assessed for eligibility</text><text x="82" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 136)</text></g><g><rect x="412" y="402" width="268" height="90" fill="#ffffff" stroke="#111" stroke-width="1.2"/><text x="422" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Reports excluded:</text><text x="422" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Wrong population (n = 40)</text><text x="422" y="453" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Wrong comparator (n = 28)</text><text x="422" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Conference abstract only (n = 18)</text></g><g><rect x="72" y="528" width="268" height="74" fill="#ffffff" stroke="#111" stroke-width="1.2"/><text x="82" y="546" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Studies included in review</text><text x="82" y="564" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 64)</text><text x="82" y="579" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Reports of included studies (n = 79)</text></g><g><rect x="752" y="56" width="268" height="90" fill="#ffffff" stroke="#111" stroke-width="1.2"/><text x="762" y="74" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Records identified from*:</text><text x="762" y="92" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Websites (n = 8)</text><text x="762" y="107" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Organisations (n = 0)</text><text x="762" y="122" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Citation searching (n = 44)</text></g><g><rect x="752" y="308" width="268" height="58" fill="#ffffff" stroke="#111" stroke-width="1.2"/><text x="762" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Reports sought for retrieval</text><text x="762" y="344" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 52)</text></g><g><rect x="1044" y="308" width="200" height="58" fill="#ffffff" stroke="#111" stroke-width="1.2"/><text x="1054" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Reports not retrieved</text><text x="1054" y="344" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 4)</text></g><g><rect x="752" y="402" width="268" height="58" fill="#ffffff" stroke="#111" stroke-width="1.2"/><text x="762" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Reports assessed for eligibility</text><text x="762" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 48)</text></g><g><rect x="1044" y="402" width="200" height="90" fill="#ffffff" stroke="#111" stroke-width="1.2"/><text x="1054" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Reports excluded:</text><text x="1054" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Wrong population (n = 12)</text><text x="1054" y="453" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Duplicate of database report</text><text x="1054" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">  (n = 7)</text></g><text x="48" y="642" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#333">*Consider, if feasible to do so, reporting the number of records identified from each database or register</text><text x="48" y="656" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#333">searched (rather than the total number across all databases/registers).</text><text x="48" y="670" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#333">**If automation tools were used, indicate how many records were excluded by a human and how many were</text><text x="48" y="684" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#333">excluded by automation tools.</text><text x="48" y="698" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#333">Source: Page MJ, et al. BMJ 2021;372:n71. doi: 10.1136/bmj.n71. This work is licensed under CC BY 4.0.</text><text x="48" y="712" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#333">Adapted from the PRISMA 2020 flow diagram templates. Diagrflow is not affiliated with prisma-statement.org.</text></svg>