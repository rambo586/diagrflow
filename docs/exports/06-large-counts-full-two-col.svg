<svg role="img" aria-label="PRISMA 2020 flow diagram" width="1292" height="770" viewBox="0 0 1292 770" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-down" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto"><path d="M0 0 L4 7 L8 0" fill="none" stroke="#111" stroke-width="1.2"></path></marker><marker id="arrow-right" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#111" stroke-width="1.2"></path></marker></defs><rect width="1292" height="770" fill="#ffffff"></rect><text x="376" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111">Identification of studies via databases and registers</text><text x="998" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111">Identification of studies via other methods</text><g><text x="22" y="117" text-anchor="middle" transform="rotate(-90 22 117)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111">Identification</text></g><g><text x="22" y="369" text-anchor="middle" transform="rotate(-90 22 369)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111">Screening</text></g><g><text x="22" y="597" text-anchor="middle" transform="rotate(-90 22 597)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111">Included</text></g><line x1="340" y1="84" x2="412" y2="84" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-right)"></line><line x1="206" y1="178" x2="206" y2="214" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-down)"></line><line x1="340" y1="242" x2="412" y2="242" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-right)"></line><line x1="206" y1="272" x2="206" y2="340" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-down)"></line><line x1="340" y1="368" x2="412" y2="368" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-right)"></line><line x1="206" y1="398" x2="206" y2="434" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-down)"></line><line x1="340" y1="462" x2="412" y2="462" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-right)"></line><line x1="206" y1="492" x2="206" y2="560" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-down)"></line><line x1="886" y1="146" x2="886" y2="340" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-down)"></line><line x1="886" y1="398" x2="886" y2="434" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-down)"></line><line x1="886" y1="492" x2="340" y2="597" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-down)"></line><g><rect x="72" y="56" width="268" height="122" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="82" y="74" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Records identified from*:</text><text x="82" y="92" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Databases (n = 124500)</text><text x="82" y="107" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Registers (n = 8340)</text><text x="82" y="122" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">  PubMed / MEDLINE (n = 52400)</text><text x="82" y="137" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">  Embase (n = 41100)</text><text x="82" y="152" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">  Scopus (n = 31000)</text></g><g><rect x="412" y="56" width="268" height="122" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="422" y="74" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Records removed before screening:</text><text x="422" y="92" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Duplicate records removed (n = 38200)</text><text x="422" y="107" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Records marked as ineligible by</text><text x="422" y="122" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">  automation tools (n = 24600)</text><text x="422" y="137" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Records removed for other reasons (n =</text><text x="422" y="152" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">  1240)</text></g><g><rect x="72" y="214" width="268" height="58" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="82" y="232" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Records screened</text><text x="82" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 68800)</text></g><g><rect x="412" y="214" width="268" height="90" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="422" y="232" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Records excluded**</text><text x="422" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Total (n = 67800)</text><text x="422" y="265" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">By a human (n = 19800)</text><text x="422" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">By automation tools (n = 48000)</text></g><g><rect x="72" y="340" width="268" height="58" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="82" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Reports sought for retrieval</text><text x="82" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 1000)</text></g><g><rect x="412" y="340" width="268" height="58" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="422" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Reports not retrieved</text><text x="422" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 62)</text></g><g><rect x="72" y="434" width="268" height="58" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="82" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Reports assessed for eligibility</text><text x="82" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 938)</text></g><g><rect x="412" y="434" width="268" height="90" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="422" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Reports excluded:</text><text x="422" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Wrong population (n = 380)</text><text x="422" y="485" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Wrong intervention (n = 245)</text><text x="422" y="500" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Wrong study design (n = 190)</text></g><g><rect x="72" y="560" width="268" height="74" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="82" y="578" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Studies included in review</text><text x="82" y="596" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 164)</text><text x="82" y="611" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Reports of included studies (n = 208)</text></g><g><rect x="752" y="56" width="268" height="90" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="762" y="74" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Records identified from*:</text><text x="762" y="92" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Websites (n = 420)</text><text x="762" y="107" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Organisations (n = 180)</text><text x="762" y="122" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Citation searching (n = 950)</text></g><g><rect x="752" y="340" width="268" height="58" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="762" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Reports sought for retrieval</text><text x="762" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 1550)</text></g><g><rect x="1044" y="340" width="200" height="58" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="1054" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Reports not retrieved</text><text x="1054" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 35)</text></g><g><rect x="752" y="434" width="268" height="58" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="762" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Reports assessed for eligibility</text><text x="762" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 1515)</text></g><g><rect x="1044" y="434" width="200" height="90" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="1054" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Reports excluded:</text><text x="1054" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Wrong population (n = 820)</text><text x="1054" y="485" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Duplicate of database report</text><text x="1054" y="500" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">  (n = 610)</text></g><text x="48" y="674" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#333">*Consider, if feasible to do so, reporting the number of records identified from each database or register</text><text x="48" y="688" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#333">searched (rather than the total number across all databases/registers).</text><text x="48" y="702" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#333">**If automation tools were used, indicate how many records were excluded by a human and how many were</text><text x="48" y="716" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#333">excluded by automation tools.</text><text x="48" y="730" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#333">Source: Page MJ, et al. BMJ 2021;372:n71. doi: 10.1136/bmj.n71. This work is licensed under CC BY 4.0.</text><text x="48" y="744" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#333">Adapted from the PRISMA 2020 flow diagram templates. Diagrflow is not affiliated with prisma-statement.org.</text></svg>