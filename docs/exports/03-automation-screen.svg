<?xml version="1.0" encoding="UTF-8"?>
<svg role="img" aria-label="PRISMA 2020 flow diagram" width="760" height="786" viewBox="0 0 760 786" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-down" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto"><path d="M0 0 L4 7 L8 0" fill="none" stroke="#111" stroke-width="1.2"></path></marker><marker id="arrow-right" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#111" stroke-width="1.2"></path></marker></defs><rect width="760" height="786" fill="#ffffff"></rect><text x="380" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111">Identification of studies via databases and registers</text><g><text x="22" y="117" text-anchor="middle" transform="rotate(-90 22 117)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111">Identification</text></g><g><text x="22" y="377" text-anchor="middle" transform="rotate(-90 22 377)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111">Screening</text></g><g><text x="22" y="613" text-anchor="middle" transform="rotate(-90 22 613)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111">Included</text></g><line x1="340" y1="84" x2="412" y2="84" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-right)"></line><line x1="206" y1="178" x2="206" y2="214" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-down)"></line><line x1="340" y1="242" x2="412" y2="242" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-right)"></line><line x1="206" y1="272" x2="206" y2="340" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-down)"></line><line x1="340" y1="368" x2="412" y2="368" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-right)"></line><line x1="206" y1="398" x2="206" y2="434" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-down)"></line><line x1="340" y1="462" x2="412" y2="462" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-right)"></line><line x1="206" y1="492" x2="206" y2="576" stroke="#111" stroke-width="1.2" marker-end="url(#arrow-down)"></line><g><rect x="72" y="56" width="268" height="122" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="82" y="74" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Records identified from*:</text><text x="82" y="92" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Databases (n = 4112)</text><text x="82" y="107" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Registers (n = 90)</text><text x="82" y="122" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">  PubMed (n = 1692)</text><text x="82" y="137" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">  Embase (n = 1510)</text><text x="82" y="152" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">  CINAHL (n = 910)</text></g><g><rect x="412" y="56" width="268" height="122" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="422" y="74" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Records removed before screening:</text><text x="422" y="92" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Duplicate records removed (n = 980)</text><text x="422" y="107" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Records marked as ineligible by</text><text x="422" y="122" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">  automation tools (n = 420)</text><text x="422" y="137" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Records removed for other reasons (n =</text><text x="422" y="152" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">  55)</text></g><g><rect x="72" y="214" width="268" height="58" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="82" y="232" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Records screened</text><text x="82" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 2747)</text></g><g><rect x="412" y="214" width="268" height="90" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="422" y="232" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Records excluded**</text><text x="422" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Total (n = 2410)</text><text x="422" y="265" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">By a human (n = 2200)</text><text x="422" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">By automation tools (n = 210)</text></g><g><rect x="72" y="340" width="268" height="58" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="82" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Reports sought for retrieval</text><text x="82" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 337)</text></g><g><rect x="412" y="340" width="268" height="58" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="422" y="358" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Reports not retrieved</text><text x="422" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 14)</text></g><g><rect x="72" y="434" width="268" height="58" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="82" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Reports assessed for eligibility</text><text x="82" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 323)</text></g><g><rect x="412" y="434" width="268" height="106" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="422" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Reports excluded:</text><text x="422" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Wrong population (n = 88)</text><text x="422" y="485" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Wrong intervention (n = 54)</text><text x="422" y="500" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Wrong study design (n = 41)</text><text x="422" y="515" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">No usable outcome (n = 22)</text></g><g><rect x="72" y="576" width="268" height="74" fill="#ffffff" stroke="#111" stroke-width="1.2"></rect><text x="82" y="594" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#111">Studies included in review</text><text x="82" y="612" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">(n = 91)</text><text x="82" y="627" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111">Reports of included studies (n = 118)</text></g><text x="48" y="690" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#333">*Consider, if feasible to do so, reporting the number of records identified from each database or register</text><text x="48" y="704" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#333">searched (rather than the total number across all databases/registers).</text><text x="48" y="718" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#333">**If automation tools were used, indicate how many records were excluded by a human and how many were</text><text x="48" y="732" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#333">excluded by automation tools.</text><text x="48" y="746" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#333">Source: Page MJ, et al. BMJ 2021;372:n71. doi: 10.1136/bmj.n71. This work is licensed under CC BY 4.0.</text><text x="48" y="760" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#333">Adapted from the PRISMA 2020 flow diagram templates. Diagrflow is not affiliated with prisma-statement.org.</text></svg>